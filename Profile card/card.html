<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Profile Card</title>
    <link rel="stylesheet" href="card.css">
    <!-- FontAwesome untuk ikon sosial media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="profile-card">
        <!-- Header / Background Cover di dalam kartu -->
        <div class="card-header">
            <div class="profile-image">
                <img src="profil.jpeg" alt="Profile Picture">
            </div>
        </div>

        <!-- Informasi Pengguna -->
        <div class="card-body">
            <h2>Bagas Krisna</h2>
            <p class="role">Siswa SMK TARUNA BHAKTI Jurusan RPL</p>
            <p class="bio">Passionate about building clean user interfaces and creating interactive web applications.</p>
            
            <!-- Statistik (Posts, Followers, Following) -->
            <div class="stats">
                <div class="stat-box">
                    <h3>10</h3>
                    <p>Posts</p>
                </div>
                <div class="stat-box">
                    <h3>405k</h3>
                    <p>Followers</p>
                </div>
                <div class="stat-box">
                    <h3>1.102</h3>
                    <p>Following</p>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="actions">
                <button class="btn-primary">Follow</button>
                <button class="btn-secondary">Message</button>
            </div>

            <!-- Tautan Sosial Media -->
            <div class="social-icons">
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
